<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jereme.dev Homelab Specs</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e14'/%3E%3Crect x='4' y='6' width='24' height='8' rx='2' fill='%23141b24' stroke='%2339c5bb' stroke-width='1.5'/%3E%3Ccircle cx='8.5' cy='10' r='1.5' fill='%234bc77a'/%3E%3Ccircle cx='13' cy='10' r='1.5' fill='%2339c5bb'/%3E%3Crect x='18' y='9' width='7' height='2' rx='1' fill='%233d4f63'/%3E%3Crect x='4' y='18' width='24' height='8' rx='2' fill='%23141b24' stroke='%2339c5bb' stroke-width='1.5'/%3E%3Ccircle cx='8.5' cy='22' r='1.5' fill='%234bc77a'/%3E%3Ccircle cx='13' cy='22' r='1.5' fill='%2339c5bb'/%3E%3Crect x='18' y='21' width='7' height='2' rx='1' fill='%233d4f63'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0d12;
    --bg-panel: #0f141b;
    --bg-elev: #141a22;
    --bg-hover: #1a212b;
    --bg-input: #0c1117;
    --border: #1f2733;
    --border-soft: #19202a;
    --border-active: #2e4256;
    --text: #c5d1e0;
    --text-dim: #8896a8;
    --text-faint: #5a6878;
    --accent: #39c5bb;
    --accent-dim: #2a9d95;
    --accent-soft: rgba(57, 197, 187, 0.12);
    --accent-glow: rgba(57, 197, 187, 0.18);
    --amber: #e6b04b;
    --amber-soft: rgba(230, 176, 75, 0.14);
    --success: #5bd17f;
    --danger: #f0706e;
    --danger-dim: rgba(240, 112, 110, 0.14);
    --purple: #bd86ed;
    --purple-bg: rgba(189, 134, 237, 0.14);
    --blue: #6f9cf0;
    --blue-bg: rgba(111, 156, 240, 0.14);
    --tag-bg: rgba(57, 197, 187, 0.1);
    --tag-border: rgba(57, 197, 187, 0.28);

    --radius: 4px;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    --titlebar-h: 48px;
    --statusbar-h: 30px;
    --sidebar-w: 232px;

    /* legacy aliases kept so any stray reference still resolves */
    --bg-primary: #0a0d12;
    --bg-secondary: #0f141b;
    --bg-tertiary: #1a212b;
    --bg-card: #141a22;
    --text-primary: #c5d1e0;
    --text-secondary: #8896a8;
    --text-muted: #5a6878;

    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-mono);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
    font-size: 14px;
    padding-bottom: var(--statusbar-h);
    -webkit-font-smoothing: antialiased;
    /* faint terminal grid backdrop, painted as the page background so it
       never establishes a stacking context that traps the drawer */
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(120, 138, 168, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 138, 168, 0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    background-attachment: fixed;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-active); }

  a { color: var(--accent); }

  /* ============================ TITLE BAR ============================ */
  .titlebar {
    position: sticky;
    top: 0;
    z-index: 90;
    height: var(--titlebar-h);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
  }
  .win-dots { display: flex; gap: 7px; align-items: center; flex-shrink: 0; }
  .win-dots .dot { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .dot.red { background: #f0706e; }
  .dot.amber { background: #e6b04b; }
  .dot.green { background: #5bd17f; }

  .title-id { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .logo {
    font-family: var(--font-mono);
    font-size: 16px; font-weight: 700;
    color: var(--accent); letter-spacing: -0.3px; white-space: nowrap;
  }
  .logo span { color: var(--text-faint); font-weight: 400; }

  .title-actions { display: flex; gap: 7px; flex-shrink: 0; margin-left: auto; }

  /* ============================ BUTTONS ============================ */
  .btn {
    font-family: var(--font-mono);
    font-size: 13px; font-weight: 500;
    padding: 7px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s, color 0.12s;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-active); background: var(--bg-hover); color: var(--text); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { background: var(--accent); color: #04130f; border-color: var(--accent); font-weight: 700; }
  .btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); color: #04130f; }
  .btn-danger { color: var(--danger); border-color: transparent; background: var(--danger-dim); }
  .btn-danger:hover { border-color: var(--danger); background: var(--danger-dim); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--text-dim); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
  .btn-sm { padding: 5px 9px; font-size: 12px; }
  .btn .kbd { color: var(--amber); font-weight: 700; }
  .btn-primary .kbd { color: #04130f; }

  /* ============================ LAYOUT ============================ */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    align-items: start;
  }

  /* ----------------------------- SIDEBAR ----------------------------- */
  .sidebar {
    position: sticky;
    top: var(--titlebar-h);
    height: calc(100vh - var(--titlebar-h) - var(--statusbar-h));
    overflow-y: auto;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 14px 10px 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .side-section { display: flex; flex-direction: column; gap: 4px; }
  .side-head {
    font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-faint); padding: 2px 8px 4px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .side-head::before { content: '┌─'; color: var(--border-active); letter-spacing: 0; }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-item {
    font-family: var(--font-mono);
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 7px 9px;
    border: none; border-left: 2px solid transparent;
    background: transparent; color: var(--text-dim);
    font-size: 13px; cursor: pointer; border-radius: 0 var(--radius) var(--radius) 0;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text); }
  .nav-item:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .nav-item .nav-ico { width: 16px; display: inline-flex; justify-content: center; flex-shrink: 0; color: var(--text-faint); }
  .nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item.tag .nav-label { text-transform: lowercase; letter-spacing: 0; }
  .nav-item .nav-count {
    font-size: 11px; color: var(--text-faint);
    background: var(--bg-elev); border: 1px solid var(--border-soft);
    padding: 0 6px; border-radius: 10px; min-width: 22px; text-align: center;
  }
  .nav-item.active {
    background: var(--accent-soft); color: var(--accent);
    border-left-color: var(--accent);
  }
  .nav-item.active .nav-ico { color: var(--accent); }
  .nav-item.active .nav-count { color: var(--accent); border-color: var(--accent-soft); background: transparent; }

  .nav-item.tag .nav-ico { color: var(--purple); }
  .nav-item.tag.active { background: var(--purple-bg); color: var(--purple); border-left-color: var(--purple); }
  .nav-item.tag.active .nav-ico { color: var(--purple); }
  .nav-item.tag.active .nav-count { color: var(--purple); }

  .side-toggle {
    display: flex; flex-direction: column; gap: 1px;
  }

  .sidebar-foot { margin-top: auto; padding: 8px; }
  .sidebar-foot a {
    font-size: 11.5px; color: var(--text-faint); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sidebar-foot a:hover { color: var(--accent); }

  .drawer-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55); z-index: 95; backdrop-filter: blur(2px);
  }
  .drawer-overlay.open { display: block; }

  /* ----------------------------- CONTENT ----------------------------- */
  .content { min-width: 0; padding: 16px 20px 28px; }

  .context-bar {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .context-title {
    font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--text);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .context-title .ctx-bracket { color: var(--accent); font-weight: 700; }
  .context-title .ctx-name { letter-spacing: 0.5px; }
  .ctx-type { text-transform: uppercase; }
  .ctx-tag { text-transform: lowercase; color: var(--purple); letter-spacing: 0; }
  .ctx-sep { color: var(--text-faint); font-weight: 400; margin: 0 6px; }
  .context-meta { font-size: 12px; color: var(--text-faint); }
  .context-spacer { flex: 1; }

  .cmdbar { position: relative; display: flex; align-items: center; margin-bottom: 16px; }
  .cmdbar .prompt {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--accent); font-weight: 700; font-size: 14px; pointer-events: none;
  }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-box {
    font-family: var(--font-mono); font-size: 14px;
    padding: 9px 36px 9px 30px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text);
    width: 100%; outline: none;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .search-box::placeholder { color: var(--text-faint); }
  .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .search-clear {
    display: none; position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
    width: 22px; height: 22px; border: none; background: transparent;
    color: var(--text-faint); cursor: pointer; border-radius: var(--radius);
    font-size: 13px; line-height: 1; align-items: center; justify-content: center;
  }
  .search-clear:hover { color: var(--text); background: var(--bg-hover); }
  .search-wrap.has-value .search-clear { display: inline-flex; }

  /* View toggle (Cards / Topology) and topo mode */
  .view-toggle {
    display: inline-flex; border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; background: var(--bg-input);
  }
  .view-btn {
    font-family: var(--font-mono); font-size: 12px;
    padding: 6px 12px; border: none; background: transparent;
    color: var(--text-dim); cursor: pointer; transition: all 0.12s;
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .view-btn:hover { color: var(--text); background: var(--bg-hover); }
  .view-btn.active { color: var(--accent); background: var(--accent-soft); }
  .view-btn + .view-btn { border-left: 1px solid var(--border); }
  .topo-mode-toggle[hidden] { display: none; }

  /* in-sidebar view toggles render full width */
  .side-toggle .view-toggle { display: flex; }
  .side-toggle .view-toggle .view-btn { flex: 1; text-align: center; }

  /* ----------------------------- PANEL ----------------------------- */
  .panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(15, 20, 27, 0.6);
    padding: 14px;
  }

  .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }

  .device-card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s;
    cursor: pointer; position: relative; overflow: hidden;
  }
  .device-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--border-active); opacity: 0.6; transition: opacity 0.12s, background 0.12s;
  }
  .device-card.t-server::before { background: var(--accent); }
  .device-card.t-vm::before { background: var(--blue); }
  .device-card.t-container::before { background: var(--purple); }
  .device-card.t-network::before { background: #e6b43c; }
  .device-card.t-storage::before { background: #e67850; }
  .device-card.t-ups::before { background: #a6e25a; }
  .device-card.t-other::before { background: #8b97a8; }
  .device-card:hover, .device-card:focus-visible {
    border-color: var(--border-active);
    box-shadow: var(--shadow);
  }
  .device-card:hover::before, .device-card:focus-visible::before { opacity: 1; }
  .device-card:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  .device-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .device-name { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--text); word-break: break-word; }

  .device-type-badge {
    font-family: var(--font-mono); font-size: 11px; line-height: 1;
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 5px 9px; border-radius: var(--radius); font-weight: 600; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .device-type-badge svg { flex-shrink: 0; display: block; }
  .device-type-badge > span { display: block; line-height: 1; padding-top: 2.5px; }
  .badge-server { background: rgba(57, 197, 187, 0.13); color: var(--accent); }
  .badge-vm { background: var(--blue-bg); color: var(--blue); }
  .badge-container { background: var(--purple-bg); color: var(--purple); }
  .badge-network { background: rgba(230, 180, 60, 0.14); color: #e6b43c; }
  .badge-storage { background: rgba(230, 120, 80, 0.14); color: #e67850; }
  .badge-ups { background: rgba(166, 226, 90, 0.14); color: #a6e25a; }
  .badge-other { background: rgba(139, 151, 168, 0.14); color: #9aa7b8; }

  .device-ip { font-family: var(--font-mono); font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .device-ip::before { content: '@ '; color: var(--text-faint); }

  .device-parent-link { font-size: 12px; color: var(--text-faint); margin-bottom: 6px; }
  .device-parent-link strong { color: var(--text-dim); font-weight: 600; }

  .device-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; }
  .meta-item { font-size: 12.5px; color: var(--text-dim); }
  .meta-item strong { color: var(--text-faint); font-weight: 500; }

  .device-services { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .service-tag {
    font-family: var(--font-mono); font-size: 11px; line-height: 1;
    display: inline-flex; align-items: center;
    padding: 6px 4px 5px 4px; border-radius: var(--radius);
    background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--accent);
  }

  .device-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .user-tag {
    font-family: var(--font-mono); font-size: 11px; line-height: 1;
    display: inline-flex; align-items: center;
    padding: 6px 4px 5px 4px; border-radius: var(--radius);
    background: var(--purple-bg); border: 1px solid rgba(189, 134, 237, 0.28); color: var(--purple);
  }

  .child-count-badge {
    font-family: var(--font-mono); font-size: 11px;
    padding: 4px 6px 3px 6px; border-radius: var(--radius);
    background: var(--blue-bg); color: var(--blue);
    margin-top: 8px; display: inline-block;
  }

  .device-status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; flex-shrink: 0; }
  .status-online { background: var(--success); box-shadow: 0 0 6px rgba(91, 199, 122, 0.45); }
  .status-offline { background: var(--danger); }
  .status-unknown { background: var(--text-faint); }

  /* ============================ STATUS BAR ============================ */
  .statusbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
    height: var(--statusbar-h);
    display: flex; align-items: center; gap: 16px;
    padding: 0 14px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim);
  }
  .status-keys { margin-left: auto; display: flex; gap: 14px; overflow: hidden; }
  .status-keys .key { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--text-faint); }
  .status-keys .key b { color: var(--amber); font-weight: 700; }
  .status-unsaved { display: none; align-items: center; gap: 6px; color: var(--amber); }
  .status-unsaved.show { display: inline-flex; }
  .status-unsaved .udot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px rgba(230, 176, 75, 0.7); }

  /* ============================ MOBILE BAR ============================ */
  .mobile-bar {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 85;
    height: 54px;
    background: var(--bg-panel); border-top: 1px solid var(--border);
  }
  .mobile-bar .mrow { display: flex; height: 100%; }
  .mbar-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: transparent; border: none; color: var(--text-dim);
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    cursor: pointer; position: relative;
  }
  .mbar-btn svg { display: block; }
  .mbar-btn.active { color: var(--accent); }
  .mbar-btn.primary { color: var(--accent); }

  /* ============================ MODALS ============================ */
  .modal-overlay, .detail-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(4, 6, 9, 0.72); z-index: 200;
    align-items: center; justify-content: center; backdrop-filter: blur(3px);
    padding: 16px;
  }
  .modal-overlay.open, .detail-overlay.open { display: flex; }

  .modal, .detail-panel {
    background: var(--bg-panel); border: 1px solid var(--border-active);
    border-radius: var(--radius); width: 100%; max-width: 1000px;
    max-height: 90vh; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
  }

  .modal-header, .detail-header {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .detail-header { align-items: flex-start; padding: 16px; }
  .modal-header::before, .detail-header::before {
    content: '';
    position: absolute;
    margin-left: 2px;
  }
  .modal-title {
    font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--text);
    display: inline-flex; align-items: center; gap: 9px;
  }
  .modal-title::before {
    content: '●●●'; letter-spacing: 2px; font-size: 9px; color: var(--text-faint);
    margin-right: 4px;
  }
  .modal-body, .detail-body { padding: 18px; flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .detail-section { margin-bottom: 18px; }
  .modal-footer, .detail-actions {
    flex-shrink: 0; display: flex; gap: 8px;
    padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .modal-footer { justify-content: flex-end; }

  .detail-section-title {
    font-family: var(--font-mono); font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint);
    margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .detail-section-title::before { content: '# '; color: var(--accent); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-field-label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; }
  .detail-field-value { font-family: var(--font-mono); font-size: 14px; color: var(--text); }
  .detail-notes { font-family: var(--font-sans); font-size: 14px; color: var(--text-dim); line-height: 1.7; white-space: pre-wrap; }

  /* ============================ FORMS ============================ */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-row[hidden] { display: none; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group[hidden] { display: none; }

  .form-label {
    font-family: var(--font-mono); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-faint);
  }
  .form-input, .form-select, .form-textarea {
    font-family: var(--font-mono); font-size: 14px;
    padding: 9px 11px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text); outline: none; transition: border-color 0.12s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--text-faint); }
  .form-textarea { resize: vertical; min-height: 80px; font-family: var(--font-mono); }
  .form-hint { font-size: 12px; color: var(--text-faint); }

  /* tag picker */
  .tag-wrap { position: relative; }
  .tag-field {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 8px; min-height: 40px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-input); cursor: text;
    transition: border-color 0.12s;
  }
  .tag-field:focus-within { border-color: var(--accent); }
  .tag-chips { display: contents; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 12px;
    padding: 3px 5px 3px 8px; border-radius: var(--radius);
    background: var(--purple-bg); border: 1px solid rgba(189, 134, 237, 0.28); color: var(--purple);
  }
  .tag-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 1px; opacity: 0.65;
  }
  .tag-chip button:hover { opacity: 1; }
  .tag-entry {
    flex: 1; min-width: 90px; border: none; outline: none; background: transparent;
    color: var(--text); font-family: var(--font-mono); font-size: 13px; padding: 4px 2px;
    text-transform: lowercase;
  }
  .tag-entry::placeholder { color: var(--text-faint); text-transform: none; }
  .tag-suggest {
    list-style: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    margin: 0; padding: 4px; background: var(--bg-elev); border: 1px solid var(--border-active);
    border-radius: var(--radius); z-index: 50; max-height: 180px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .tag-suggest[hidden] { display: none; }
  .tag-suggest-item {
    font-family: var(--font-mono); font-size: 13px; padding: 7px 10px;
    border-radius: var(--radius); color: var(--text-dim); cursor: pointer;
  }
  .tag-suggest-item:hover, .tag-suggest-item.active { background: var(--bg-hover); color: var(--purple); }
  .tag-suggest-item .new-hint { color: var(--text-faint); font-size: 11px; margin-left: 6px; }

  .export-warning {
    font-family: var(--font-sans); font-size: 13.5px; line-height: 1.5; color: var(--text-dim);
    padding: 12px 14px; margin-bottom: 16px;
    background: var(--danger-dim); border: 1px solid var(--danger);
    border-radius: var(--radius);
  }
  .export-warning strong { color: var(--text); }

  /* custom form select */
  .form-select-wrap { position: relative; width: 100%; min-width: 0; }
  .form-select-toggle {
    width: 100%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--font-mono); font-size: 14px;
    padding: 9px 11px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text); cursor: pointer; text-align: left; outline: none;
    transition: border-color 0.12s;
  }
  .form-select-toggle:hover { border-color: var(--border-active); }
  .form-select-toggle:focus, .form-select-toggle[aria-expanded="true"] { border-color: var(--accent); }
  .form-select-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .form-select-chevron { color: var(--text-faint); flex-shrink: 0; transition: transform 0.15s; }
  .form-select-toggle[aria-expanded="true"] .form-select-chevron { transform: rotate(180deg); }
  .form-select-menu {
    list-style: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    margin: 0; padding: 4px; background: var(--bg-elev);
    border: 1px solid var(--border-active); border-radius: var(--radius);
    z-index: 50; max-height: 240px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .form-select-menu[hidden] { display: none; }
  .form-select-option {
    font-family: var(--font-mono); font-size: 13px;
    padding: 8px 11px; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer; transition: background 0.1s, color 0.1s;
  }
  .form-select-option:hover { background: var(--bg-hover); color: var(--text); }
  .form-select-option.active { background: var(--accent-soft); color: var(--accent); }

  .services-editor { margin-top: 4px; }
  .service-entry { display: grid; grid-template-columns: 60px 1fr 70px 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .storage-entry { display: grid; grid-template-columns: 60px 1fr 80px 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .service-entry .form-input, .storage-entry .form-input { font-size: 13px; padding: 7px 9px; }
  .row-private-cell { display: flex; justify-content: center; align-items: center; }
  .row-private-cell input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .private-badge {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 1px 6px; border-radius: var(--radius); margin-left: 8px;
    background: var(--danger-dim); color: var(--danger); vertical-align: middle;
  }
  .service-remove {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: var(--radius);
  }
  .service-remove:hover { color: var(--danger); }
  .service-add-btn {
    font-family: var(--font-mono); font-size: 12.5px;
    padding: 7px 12px; border-radius: var(--radius);
    border: 1px dashed var(--border-active); background: transparent;
    color: var(--text-dim); cursor: pointer; transition: all 0.12s; width: 100%; text-align: center;
  }
  .service-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .service-labels { display: grid; grid-template-columns: 60px 1fr 70px 1fr 1fr auto; gap: 8px; margin-bottom: 6px; }
  .storage-labels { display: grid; grid-template-columns: 60px 1fr 80px 1fr auto; gap: 8px; margin-bottom: 6px; }
  .service-labels span, .storage-labels span {
    font-family: var(--font-mono); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint);
  }

  /* tables */
  .service-table { width: 100%; border-collapse: collapse; }
  .service-table th {
    font-family: var(--font-mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint);
    text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  .service-table td {
    font-family: var(--font-mono); font-size: 13px;
    padding: 8px 10px; color: var(--text); border-bottom: 1px solid var(--border-soft);
  }
  .service-table td.svc-notes { color: var(--text-dim); font-family: var(--font-sans); }
  .service-table tr:last-child td { border-bottom: none; }

  .child-device {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 6px; cursor: pointer; transition: all 0.12s;
  }
  .child-device:hover { border-color: var(--border-active); background: var(--bg-hover); }
  .child-device-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; }
  .child-device-info { font-size: 12px; color: var(--text-dim); }

  /* empty state */
  .empty-state { text-align: center; padding: 64px 20px; }
  .empty-icon { font-size: 46px; margin-bottom: 14px; opacity: 0.25; color: var(--accent); }
  .empty-title { font-family: var(--font-mono); font-size: 16px; color: var(--text-dim); margin-bottom: 8px; }
  .empty-text { font-size: 13.5px; color: var(--text-faint); margin-bottom: 20px; }

  /* toasts */
  .toast-container { position: fixed; bottom: calc(var(--statusbar-h) + 14px); right: 18px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    font-family: var(--font-mono); font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius);
    background: var(--bg-elev); border: 1px solid var(--border-active);
    color: var(--text); box-shadow: var(--shadow); animation: slideIn 0.2s ease;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .toast::before { content: '›'; color: var(--accent); font-weight: 700; margin-right: 4px; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  .toast.error::before { color: var(--danger); }
  .toast-action {
    margin-left: 8px; background: none; border: none; color: var(--accent);
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    padding: 2px 6px; text-transform: uppercase; letter-spacing: 0.5px; border-radius: var(--radius);
  }
  .toast-action:hover { background: var(--accent-soft); }

  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(20px); } }
  .toast.removing { animation: fadeOut 0.3s ease forwards; }

  .detail-panel.confirm-panel { max-width: 440px; }
  .confirm-dialog { text-align: center; padding: 12px 0; }
  .confirm-dialog p { font-family: var(--font-sans); font-size: 15px; color: var(--text-dim); margin-bottom: 20px; }
  .confirm-dialog .btn-group { display: flex; justify-content: center; gap: 10px; }

  /* export dropdown menu */
  .export-wrap { position: relative; }
  .export-menu {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-elev); border: 1px solid var(--border-active);
    border-radius: var(--radius); box-shadow: var(--shadow);
    min-width: 190px; z-index: 200; overflow: hidden;
  }
  .export-menu.open { display: block; }
  .export-menu button {
    display: block; width: 100%; text-align: left; padding: 9px 14px;
    background: none; border: none; color: var(--text);
    font-family: var(--font-mono); font-size: 13px; cursor: pointer; line-height: 1.4;
  }
  .export-menu button:hover { background: var(--bg-hover); color: var(--accent); }
  .export-menu-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-faint); padding: 8px 14px 4px; font-family: var(--font-mono);
  }
  .export-menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  /* unsaved dot on the export button */
  .btn.has-unsaved { position: relative; }
  .btn.has-unsaved::after {
    content: ''; position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 5px rgba(230, 176, 75, 0.7);
  }

  /* ============================ TOPOLOGY ============================ */
  .topology-view { display: none; }
  .topology-view.active { display: block; }
  .topology-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 20px; color: var(--text-faint); font-size: 14px;
  }
  .topology-clusters {
    display: grid; grid-template-columns: repeat(auto-fill, 280px);
    gap: 26px 22px; align-items: start; justify-content: center;
  }
  .topo-cluster { overflow: visible; display: block; }
  .topo-cluster .topo-box { fill: var(--bg-elev); stroke: var(--border); stroke-width: 1; transition: fill 0.12s, stroke 0.12s, filter 0.12s; }
  .topo-cluster .topo-node { cursor: pointer; }
  .topo-cluster .topo-node:hover .topo-box, .topo-cluster .topo-node:focus-visible .topo-box {
    fill: var(--bg-hover); stroke: var(--border-active);
    filter: drop-shadow(0 0 8px rgba(57, 197, 187, 0.35));
  }
  .topo-cluster .topo-node:focus { outline: none; }
  .topo-cluster .topo-text-name { font-family: var(--font-mono); font-size: 13px; font-weight: 600; fill: var(--text); pointer-events: none; }
  .topo-cluster .topo-text-type { font-family: var(--font-mono); font-size: 10px; fill: var(--text-faint); letter-spacing: 0.5px; pointer-events: none; }
  .topo-cluster .topo-edge { stroke: var(--border-active); stroke-width: 1; fill: none; }
  .topo-cluster .topo-edge-power { stroke: #a6e25a; stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; opacity: 0.85; }
  .topo-cluster .topo-status { stroke: none; pointer-events: none; }
  .topo-status.status-online { fill: var(--success); }
  .topo-status.status-offline { fill: var(--danger); }
  .topo-status.status-unknown { fill: var(--text-faint); }
  .topo-cluster .topo-accent { pointer-events: none; }
  .topo-accent-server { fill: var(--accent); }
  .topo-accent-vm { fill: var(--blue); }
  .topo-accent-container { fill: var(--purple); }
  .topo-accent-network { fill: #e6b43c; }
  .topo-accent-storage { fill: #e67850; }
  .topo-accent-ups { fill: #a6e25a; }
  .topo-accent-other { fill: #8b97a8; }
  .topo-cluster .topo-type-icon { pointer-events: none; }
  .topo-type-icon-server { color: var(--accent); }
  .topo-type-icon-vm { color: var(--blue); }
  .topo-type-icon-container { color: var(--purple); }
  .topo-type-icon-network { color: #e6b43c; }
  .topo-type-icon-storage { color: #e67850; }
  .topo-type-icon-ups { color: #a6e25a; }
  .topo-type-icon-other { color: #8b97a8; }

  .hidden { display: none; }

  /* ============================ RESPONSIVE ============================ */
  @media (max-width: 860px) {
    :root { --statusbar-h: 0px; }
    body { padding-bottom: 54px; background-size: 48px 48px; }

    .win-dots { display: none; }
    /* Import/Export live in the header on mobile; Add stays in the bottom bar */
    .title-actions .btn-primary { display: none; }

    .layout { grid-template-columns: 1fr; }

    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; height: 100vh;
      width: 84%; max-width: 300px; z-index: 96;
      transform: translateX(-100%); transition: transform 0.2s ease;
      border-right: 1px solid var(--border-active);
      padding-top: 16px;
    }
    .sidebar.open { transform: translateX(0); }

    .content { padding: 14px; }
    .context-bar .primary-view { display: none; }
    /* Keep the context bar one fixed-height row so toggling Cards/Topo
       (which shows the Network/Power switch) doesn't shift the layout. */
    .context-bar { flex-wrap: nowrap; min-height: 30px; }
    .context-title { min-width: 0; flex-shrink: 1; overflow: hidden; }
    .context-title .ctx-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .context-meta { display: none; }
    .topo-mode-toggle-wrap { flex-shrink: 0; }
    .device-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .service-entry { grid-template-columns: 1fr 60px auto; }
    .detail-grid { grid-template-columns: 1fr; }
    .topology-clusters { grid-template-columns: 1fr; max-width: 320px; margin: 0 auto; }
    .topo-cluster { width: 100%; height: auto; }

    .statusbar { display: none; }
    .mobile-bar { display: block; }
    .toast-container { bottom: 66px; left: 12px; right: 12px; }
    .toast { width: 100%; }
  }
</style>
</head>

function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("drawerOverlay").classList.remove("open");var t=document.getElementById("mbMenu");if(t)t.setAttribute("aria-expanded","false");}
function toggleSidebar(){if(document.getElementById("sidebar").classList.contains("open"))closeSidebar();else openSidebar();}
function getFilteredDevices(){
  var query=document.getElementById("searchBox").value.toLowerCase();
  var filtered=DEVICES.filter(function(d){
    if(currentFilter!=="all"&&d.type!==currentFilter)return false;
    if(currentTagFilter&&(d.tags||[]).indexOf(currentTagFilter)===-1)return false;
    if(query){
      var svcText=(d.services||[]).map(function(s){return s.name+" "+s.notes;}).join(" ");
      var storageText=(d.storage||[]).map(function(s){return s.type+" "+s.size+" "+s.notes;}).join(" ");
      var tagsText=(d.tags||[]).join(" ");
      var hay=[d.name,d.os,d.system,d.type,d.cpu,d.ram,d.gpu,d.notes,svcText,storageText,tagsText].join(" ").toLowerCase();
      return hay.indexOf(query)!==-1;
    }
    return true;
  });
  filtered.sort(sortByName);
  return filtered;
}
function renderDevices(){
  var filtered=getFilteredDevices();
  updateContext(filtered.length,DEVICES.length);
  var grid=document.getElementById("deviceGrid");
  if(!filtered.length){
    grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">\u29E1</div><div class="empty-title">'+(DEVICES.length===0?"No entries":"No matches")+'</div><div class="empty-text">'+(DEVICES.length===0?"":"Try adjusting your search or filter.")+'</div></div>';
    return;
  }
  grid.innerHTML=filtered.map(function(d){
    var children=getChildren(d.id);
    var parent=d.parentId?getDevice(d.parentId):null;
    var svcs=sortedServices(d.services);
    var storage=sortedStorage(d.storage||[]);
    var storageHtml="";
    if(storage.length){
      var first=storage[0];
      var firstLabel=esc(first.size?first.type+" "+first.size:first.type);
      if(storage.length>2){storageHtml=firstLabel+", +"+(storage.length-1)+" more";}
      else{storageHtml=storage.map(function(s){return esc(s.size?s.type+" "+s.size:s.type);}).join(", ");}
    }
    return '<div class="device-card t-'+esc(d.type||"other")+'" tabindex="0" role="button" data-id="'+esc(d.id)+'">'+
      '<div class="device-card-header"><div><div class="device-name">'+esc(d.name)+'</div></div>'+
      typeBadge(d.type)+'</div>'+
      (parent?'<div class="device-parent-link">on <strong>'+esc(parent.name)+'</strong></div>':"")+
      '<div class="device-meta">'+
        (d.system?'<span class="meta-item"><strong>System:</strong> '+esc(d.system)+'</span>':"")+
        (d.os?'<span class="meta-item"><strong>OS / Firmware:</strong> '+esc(d.os)+'</span>':"")+
        (d.cpu?'<span class="meta-item"><strong>CPU:</strong> '+esc(d.cpu)+'</span>':"")+
        (d.ram?'<span class="meta-item"><strong>RAM:</strong> '+esc(d.ram)+'</span>':"")+
        (d.gpu?'<span class="meta-item"><strong>GPU:</strong> '+esc(d.gpu)+'</span>':"")+
        (storageHtml?'<span class="meta-item"><strong>Storage:</strong> '+storageHtml+'</span>':"")+
      '</div>'+
      ((d.tags||[]).length?'<div class="device-tags">'+
        (d.tags||[]).map(function(t){return '<span class="user-tag">#'+esc(t)+'</span>';}).join("")+
      '</div>':"")+
      (svcs.length?'<div class="device-services">'+
        svcs.slice(0,3).map(function(s){return '<span class="service-tag">'+esc(s.name)+'</span>';}).join("")+
        (svcs.length>3?'<span class="service-tag">+'+(svcs.length-3)+' more</span>':"")+
      '</div>':"")+
      (children.length?'<span class="child-count-badge">'+children.length+" "+(children.length===1?"child":"children")+'</span>':"")+
    '</div>';
  }).join("");
}
function renderTopology(){
  var filtered=getFilteredDevices();
  var container=document.getElementById("topologyView");
  if(!filtered.length){container.innerHTML='<div class="topology-empty">'+(DEVICES.length===0?"No entries yet.":"No matches for the current search/filter.")+'</div>';return;}
  var filteredIds={};filtered.forEach(function(d){filteredIds[d.id]=1;});
  function buildNetworkTree(device,seen){
    if(seen&&seen[device.id])return {device:device,children:[]};
    var next={};for(var k in seen)next[k]=seen[k];next[device.id]=1;
    var kids=filtered.filter(function(c){return c.parentId===device.id;}).sort(sortByName);
    return {device:device,children:kids.map(function(k){return buildNetworkTree(k,next);})};
  }
  function buildPowerTree(device,seen){
    if(seen&&seen[device.id])return {device:device,children:[]};
    var next={};for(var k in seen)next[k]=seen[k];next[device.id]=1;
    var powerKids=filtered.filter(function(c){return c.poweredById===device.id;});
    var virtualKids=filtered.filter(function(c){return c.parentId===device.id&&isVirtualType(c.type)&&!c.poweredById;});
    var kids=powerKids.concat(virtualKids).sort(sortByName);
    return {device:device,children:kids.map(function(k){return buildPowerTree(k,next);})};
  }
  var networkRoots=filtered.filter(function(d){return !d.parentId&&!isUps(d.type);});
  var networkOrphans=filtered.filter(function(d){return d.parentId&&!filteredIds[d.parentId];});
  var networkTrees=networkRoots.concat(networkOrphans).map(function(d){return buildNetworkTree(d);})
    .sort(function(a,b){return sortByName(a.device,b.device);});
  var poweringIds={};filtered.forEach(function(d){if(d.poweredById&&filteredIds[d.poweredById])poweringIds[d.poweredById]=1;});
  var powerRoots=filtered.filter(function(d){return (poweringIds[d.id]||isUps(d.type))&&(!d.poweredById||!filteredIds[d.poweredById]);});
  var powerOrphans=filtered.filter(function(d){return d.poweredById&&!filteredIds[d.poweredById];});
  var powerTrees=powerRoots.concat(powerOrphans).map(function(d){return buildPowerTree(d);})
    .sort(function(a,b){return sortByName(a.device,b.device);});
  var trees=topoMode==="power"?powerTrees:networkTrees;
  var opts=topoMode==="power"?{edgeType:"power",showStatus:false}:{showStatus:false};
  if(!trees.length){
    var msg;
    if(topoMode==="power"&&isVirtualType(currentFilter))msg=(currentFilter==="vm"?"VMs":"Containers")+" inherit power from their host, so they don\u2019t appear here on their own.";
    else if(topoMode==="power")msg="No power relationships in this set.";
    else if(isUps(currentFilter))msg="UPS devices are shown in the Power view — switch the topology mode above.";
    else msg="No matches for the current search/filter.";
    container.innerHTML='<div class="topology-empty">'+msg+'</div>';return;
  }
  container.innerHTML='<div class="topology-clusters">'+trees.map(function(t){return topologyClusterSvg(t,opts);}).join("")+'</div>';
}
var VIEW_KEY="homelab_view";
var TOPO_MODE_KEY="homelab_topo_mode";
var topoMode="network";
try{var savedView=localStorage.getItem(VIEW_KEY);if(savedView==="topology"||savedView==="grid")currentView=savedView;}catch(_){}
try{var savedMode=localStorage.getItem(TOPO_MODE_KEY);if(savedMode==="power")topoMode=savedMode;}catch(_){}
function applyViewUI(){
  var btns=document.querySelectorAll("[data-view]");
  for(var i=0;i<btns.length;i++){var active=btns[i].getAttribute("data-view")===currentView;btns[i].classList.toggle("active",active);btns[i].setAttribute("aria-selected",active?"true":"false");}
  document.getElementById("deviceGrid").style.display=currentView==="grid"?"":"none";
  document.getElementById("topologyView").classList.toggle("active",currentView==="topology");
  var modeRow=document.getElementById("topoModeRow");
  if(modeRow)modeRow.hidden=currentView!=="topology";
  var mbtns=document.querySelectorAll("[data-topo-mode]");
  for(var j=0;j<mbtns.length;j++){var a=mbtns[j].getAttribute("data-topo-mode")===topoMode;mbtns[j].classList.toggle("active",a);mbtns[j].setAttribute("aria-selected",a?"true":"false");}
}
function setView(v){
  currentView=v;
  try{localStorage.setItem(VIEW_KEY,v);}catch(_){}
  applyViewUI();
  if(v==="topology")renderTopology();
}
function setTopoMode(m){
  topoMode=m;
  try{localStorage.setItem(TOPO_MODE_KEY,m);}catch(_){}
  applyViewUI();
  renderTopology();
}
function showDetail(id){
  var d=getDevice(id);if(!d)return;
  var children=getChildren(d.id);
  var parent=d.parentId?getDevice(d.parentId):null;
  var powerSource=d.poweredById?getDevice(d.poweredById):null;
  var poweredDevices=DEVICES.filter(function(x){return x.poweredById===d.id;}).sort(sortByName);
  var html='<div class="detail-header"><div>'+
    '<div style="font-family:\'JetBrains Mono\',monospace;font-size:22px;font-weight:700;margin-bottom:4px;">'+esc(d.name)+'</div>'+
    typeBadge(d.type)+
    (parent?' <span style="font-size:14px;color:var(--text-secondary);margin-left:10px;">on <strong>'+esc(parent.name)+'</strong></span>':"")+
  '</div><button class="btn btn-ghost btn-sm" data-action="close-detail">\u2715</button></div>';
  var field=function(label,val){return val?'<div><div class="detail-field-label">'+label+'</div><div class="detail-field-value">'+esc(val)+'</div></div>':"";};
  var overview=field("System",d.system)+field("OS / Firmware",d.os);
  var hardware=field("CPU",d.cpu)+field("RAM",d.ram)+field("GPU",d.gpu);
  html+='<div class="detail-body">';
  if((d.tags||[]).length){
    html+='<div class="detail-section"><div class="detail-section-title">Tags</div><div class="device-tags" style="margin-top:0;">'+
      (d.tags||[]).map(function(t){return '<span class="user-tag">#'+esc(t)+'</span>';}).join("")+
    '</div></div>';
  }
  if(overview){
    html+='<div class="detail-section"><div class="detail-section-title">Overview</div><div class="detail-grid">'+overview+'</div></div>';
  }
  if(hardware){
    html+='<div class="detail-section"><div class="detail-section-title">Hardware</div><div class="detail-grid">'+hardware+'</div></div>';
  }
  if(d.storage&&d.storage.length){
    var sortedSt=sortedStorage(d.storage);
    html+='<div class="detail-section"><div class="detail-section-title">Storage ('+sortedSt.length+')</div>'+
      '<table class="service-table"><thead><tr><th>Type / Device</th><th>Size</th><th>Notes</th></tr></thead><tbody>'+
      sortedSt.map(function(s){return '<tr><td>'+esc(s.type)+'</td><td>'+(esc(s.size)||"\u2014")+'</td><td class="svc-notes">'+(esc(s.notes)||"\u2014")+'</td></tr>';}).join("")+
      '</tbody></table></div>';
  }
  if(d.services&&d.services.length){
    var sortedSv=sortedServices(d.services);
    html+='<div class="detail-section"><div class="detail-section-title">Services ('+sortedSv.length+')</div>'+
      '<table class="service-table"><thead><tr><th>Service</th><th>Notes</th></tr></thead><tbody>'+
      sortedSv.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td class="svc-notes">'+(esc(s.notes)||"\u2014")+'</td></tr>';}).join("")+
      '</tbody></table></div>';
  }
  if(children.length){
    html+='<div class="detail-section"><div class="detail-section-title">Running on this Host / Parent ('+children.length+')</div>'+
      children.map(function(c){return '<div class="child-device" data-detail-id="'+esc(c.id)+'"><div class="child-device-name">'+esc(c.name)+'</div>'+typeBadge(c.type)+'</div>';}).join("")+
    '</div>';
  }
  if(parent){
    html+='<div class="detail-section"><div class="detail-section-title">Host / Parent</div>'+
      '<div class="child-device" data-detail-id="'+esc(parent.id)+'"><div class="child-device-name">'+esc(parent.name)+'</div>'+typeBadge(parent.type)+'</div>'+
    '</div>';
  }
  if(powerSource){
    html+='<div class="detail-section"><div class="detail-section-title">Power Source</div>'+
      '<div class="child-device" data-detail-id="'+esc(powerSource.id)+'"><div class="child-device-name">'+esc(powerSource.name)+'</div>'+typeBadge(powerSource.type)+'</div>'+
    '</div>';
  }
  if(poweredDevices.length){
    html+='<div class="detail-section"><div class="detail-section-title">Powered devices ('+poweredDevices.length+')</div>'+
      poweredDevices.map(function(c){return '<div class="child-device" data-detail-id="'+esc(c.id)+'"><div class="child-device-name">'+esc(c.name)+'</div>'+typeBadge(c.type)+'</div>';}).join("")+
    '</div>';
  }
  if(d.notes){
    html+='<div class="detail-section"><div class="detail-section-title">Notes</div><div class="detail-notes">'+esc(d.notes)+'</div></div>';
  }
  html+='</div>';
  document.getElementById("detailPanel").innerHTML=html;
  document.getElementById("detailOverlay").classList.add("open");
}
function closeDetail(){document.getElementById("detailOverlay").classList.remove("open");}
document.getElementById("searchBox").addEventListener("input",function(){document.getElementById("searchWrap").classList.toggle("has-value",!!this.value);renderDevices();if(currentView==="topology")renderTopology();});
document.getElementById("searchClear").addEventListener("click",function(){var b=document.getElementById("searchBox");b.value="";document.getElementById("searchWrap").classList.remove("has-value");b.focus();renderDevices();if(currentView==="topology")renderTopology();});
document.getElementById("filterGroup").addEventListener("click",function(e){var b=e.target.closest("[data-filter]");if(b)setFilter(b.getAttribute("data-filter"));});
document.getElementById("tagFilterGroup").addEventListener("click",function(e){var b=e.target.closest("[data-tag]");if(b)setTagFilter(b.getAttribute("data-tag"));});
document.getElementById("mbMenu").addEventListener("click",toggleSidebar);
document.getElementById("drawerOverlay").addEventListener("click",closeSidebar);
document.getElementById("deviceGrid").addEventListener("click",function(e){var c=e.target.closest("[data-id]");if(c)showDetail(c.getAttribute("data-id"));});
document.getElementById("deviceGrid").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var c=e.target.closest("[data-id]");if(c){e.preventDefault();showDetail(c.getAttribute("data-id"));}}});
document.getElementById("topologyView").addEventListener("click",function(e){var n=e.target.closest("[data-id]");if(n)showDetail(n.getAttribute("data-id"));});
document.querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){setView(b.getAttribute("data-view"));});});
document.querySelectorAll("[data-topo-mode]").forEach(function(b){b.addEventListener("click",function(){setTopoMode(b.getAttribute("data-topo-mode"));});});
document.getElementById("detailPanel").addEventListener("click",function(e){var n=e.target.closest("[data-detail-id]");if(n){showDetail(n.getAttribute("data-detail-id"));return;}if(e.target.closest("[data-action=close-detail]"))closeDetail();});
document.getElementById("detailOverlay").addEventListener("click",function(e){if(e.target.id==="detailOverlay")closeDetail();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail();});
document.addEventListener("keydown",function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;var tag=(e.target.tagName||"").toLowerCase();var typing=tag==="input"||tag==="textarea"||tag==="select";if(e.key==="Escape"&&document.getElementById("sidebar").classList.contains("open")){closeSidebar();return;}if(typing)return;if(e.key==="/"){e.preventDefault();document.getElementById("searchBox").focus();}else if(e.key==="c"||e.key==="C")setView("grid");else if(e.key==="t"||e.key==="T")setView("topology");});
applyViewUI();renderFilters();renderDevices();if(currentView==="topology")renderTopology();
</script>
