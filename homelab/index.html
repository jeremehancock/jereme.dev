@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root{--bg-primary:#0a0e14;--bg-secondary:#111820;--bg-tertiary:#1a2130;--bg-card:#141b24;--border:#1e2a3a;--border-active:#2d4a6f;--text-primary:#c8d6e5;--text-secondary:#95a8be;--text-muted:#738aa3;--accent:#39c5bb;--accent-dim:#2a9d95;--accent-glow:rgba(57,197,187,0.15);--success:#4bc77a;--tag-bg:rgba(57,197,187,0.1);--tag-border:rgba(57,197,187,0.25);--purple:#b478e6;--purple-bg:rgba(180,120,230,0.15);--blue:#648ce6;--blue-bg:rgba(100,140,230,0.15);--radius:6px;--shadow:0 2px 12px rgba(0,0,0,0.3);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;line-height:1.6;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg-primary);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--border-active);}
.header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;}
.main{max-width:1200px;margin:0 auto;padding:24px 32px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.search-wrap{position:relative;display:inline-block;}
.search-box{font-family:'JetBrains Mono',monospace;font-size:15px;padding:8px 34px 8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);width:320px;outline:none;transition:border-color 0.15s ease;}
.search-box::placeholder{color:var(--text-muted);}.search-box:focus{border-color:var(--accent);}
.search-clear{display:none;position:absolute;top:50%;right:6px;transform:translateY(-50%);width:22px;height:22px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:50%;padding:0;font-size:14px;line-height:1;align-items:center;justify-content:center;transition:color 0.15s,background 0.15s;}
.search-clear:hover{color:var(--text-primary);background:var(--bg-tertiary);}
.search-wrap.has-value .search-clear{display:inline-flex;}
.filter-group{display:flex;gap:4px;flex-wrap:wrap;}
.filter-btn{font-family:'JetBrains Mono',monospace;font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.15s ease;text-transform:uppercase;letter-spacing:0.5px;}
.filter-btn:hover{border-color:var(--border-active);color:var(--text-primary);}.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
.stats-bar{display:flex;gap:24px;margin-bottom:24px;padding:14px 20px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;}
.stat{display:flex;align-items:baseline;gap:6px;}.stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);}.stat-label{font-size:14px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;}
.device-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}

.device-name{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--text-primary);}

.btn{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;transition:all 0.15s ease;display:inline-flex;align-items:center;gap:6px;}.btn:hover{border-color:var(--border-active);background:var(--bg-card);}.btn-ghost{border-color:transparent;background:transparent;}.btn-ghost:hover{background:var(--bg-tertiary);}.btn-sm{padding:5px 10px;font-size:14px;}

.child-device{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:all 0.15s;}.child-device:hover{border-color:var(--border-active);background:var(--bg-tertiary);}.child-device-name{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;}.child-device-info{font-size:13px;color:var(--text-secondary);}
.empty-state{text-align:center;padding:80px 20px;}.empty-icon{font-size:52px;margin-bottom:16px;opacity:0.3;}.empty-title{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--text-secondary);margin-bottom:8px;}.empty-text{font-size:15px;color:var(--text-muted);margin-bottom:20px;}
.footer{text-align:center;padding:24px 16px;border-top:1px solid var(--border);margin-top:40px;}.footer-link{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-muted);text-decoration:none;transition:color 0.15s;}.footer-link:hover{color:var(--accent);}
@media (max-width:640px){.header{padding:12px 16px;}.main{padding:16px;}.device-grid{grid-template-columns:1fr;}.detail-grid{grid-template-columns:1fr;}.toolbar{flex-direction:column;align-items:stretch;}.search-wrap{display:block;}.search-box{width:100%;}.stats-bar{flex-wrap:wrap;gap:16px;}}
</style>

  var grid=document.getElementById("deviceGrid");
  if(!filtered.length){
    grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">\u29E1</div><div class="empty-title">'+(DEVICES.length===0?"No devices":"No matches")+'</div><div class="empty-text">'+(DEVICES.length===0?"":"Try adjusting your search or filter.")+'</div></div>';
    return;
  }
  grid.innerHTML=filtered.map(function(d){
    var children=getChildren(d.id);
    var parent=d.parentId?getDevice(d.parentId):null;
    var svcs=d.services||[];
    var storage=d.storage||[];
    var storageHtml="";
    if(storage.length){
      var first=storage[0];
      var firstLabel=esc(first.size?first.type+" "+first.size:first.type);
      if(storage.length>2){storageHtml=firstLabel+", +"+(storage.length-1)+" more";}
      else{storageHtml=storage.map(function(s){return esc(s.size?s.type+" "+s.size:s.type);}).join(", ");}
    }
    return '<div class="device-card '+(children.length?"has-children":"")+'" tabindex="0" role="button" data-id="'+esc(d.id)+'">'+
      '<div class="device-card-header"><div><div class="device-name">'+esc(d.name)+'</div></div>'+
      '<span class="device-type-badge '+getTypeClass(d.type)+'">'+esc(d.type)+'</span></div>'+
      (parent?'<div class="device-parent-link">on <strong>'+esc(parent.name)+'</strong></div>':"")+
      '<div class="device-meta">'+
        (d.system?'<span class="meta-item"><strong>System:</strong> '+esc(d.system)+'</span>':"")+
        (d.os?'<span class="meta-item"><strong>OS:</strong> '+esc(d.os)+'</span>':"")+
        (d.cpu?'<span class="meta-item"><strong>CPU:</strong> '+esc(d.cpu)+'</span>':"")+
        (d.ram?'<span class="meta-item"><strong>RAM:</strong> '+esc(d.ram)+'</span>':"")+
        (storageHtml?'<span class="meta-item"><strong>Storage:</strong> '+storageHtml+'</span>':"")+
      '</div>'+
      (svcs.length?'<div class="device-services">'+
        svcs.slice(0,3).map(function(s){return '<span class="service-tag">'+esc(s.name)+'</span>';}).join("")+
        (svcs.length>3?'<span class="service-tag">+'+(svcs.length-3)+' more</span>':"")+
      '</div>':"")+
      (children.length?'<span class="child-count-badge">'+children.length+" "+(children.length===1?"child":"children")+'</span>':"")+
    '</div>';
  }).join("");
}
function showDetail(id){
  var d=getDevice(id);if(!d)return;
  var children=getChildren(d.id);
  var parent=d.parentId?getDevice(d.parentId):null;
  var html='<div class="detail-header"><div>'+
    '<div style="font-family:\'JetBrains Mono\',monospace;font-size:22px;font-weight:700;margin-bottom:4px;">'+esc(d.name)+'</div>'+
    '<span class="device-type-badge '+getTypeClass(d.type)+'" style="display:inline-block;">'+esc(d.type)+'</span>'+
    (parent?' <span style="font-size:14px;color:var(--text-secondary);margin-left:10px;">on <strong>'+esc(parent.name)+'</strong></span>':"")+
  '</div><button class="btn btn-ghost btn-sm" data-action="close-detail">\u2715</button></div>';
  var hasOverview=d.system||d.os;
  var hasHardware=d.cpu||d.ram;
  html+='<div class="detail-body">';
  if(hasOverview){
    html+='<div class="detail-section"><div class="detail-section-title">Overview</div><div class="detail-grid">'+
      '<div><div class="detail-field-label">System</div><div class="detail-field-value">'+(esc(d.system)||"\u2014")+'</div></div>'+
      '<div><div class="detail-field-label">OS</div><div class="detail-field-value">'+(esc(d.os)||"\u2014")+'</div></div>'+
    '</div></div>';
  }
  if(hasHardware){
    html+='<div class="detail-section"><div class="detail-section-title">Hardware</div><div class="detail-grid">'+
      '<div><div class="detail-field-label">CPU</div><div class="detail-field-value">'+(esc(d.cpu)||"\u2014")+'</div></div>'+
      '<div><div class="detail-field-label">RAM</div><div class="detail-field-value">'+(esc(d.ram)||"\u2014")+'</div></div>'+
    '</div></div>';
  }
  if(d.storage&&d.storage.length){
    html+='<div class="detail-section"><div class="detail-section-title">Storage ('+d.storage.length+')</div>'+
      '<table class="service-table"><thead><tr><th>Type / Device</th><th>Size</th><th>Notes</th></tr></thead><tbody>'+
      d.storage.map(function(s){return '<tr><td>'+esc(s.type)+'</td><td>'+(esc(s.size)||"\u2014")+'</td><td class="svc-notes">'+(esc(s.notes)||"\u2014")+'</td></tr>';}).join("")+
      '</tbody></table></div>';
  }
  if(d.services&&d.services.length){
    html+='<div class="detail-section"><div class="detail-section-title">Services ('+d.services.length+')</div>'+
      '<table class="service-table"><thead><tr><th>Service</th><th>Notes</th></tr></thead><tbody>'+
      d.services.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td class="svc-notes">'+(esc(s.notes)||"\u2014")+'</td></tr>';}).join("")+
      '</tbody></table></div>';
  }
  if(children.length){
    html+='<div class="detail-section"><div class="detail-section-title">Running on this host ('+children.length+')</div>'+
      children.map(function(c){return '<div class="child-device" data-detail-id="'+esc(c.id)+'"><div><div class="child-device-name">'+esc(c.name)+'</div><div class="child-device-info">'+esc(c.type)+(c.services&&c.services.length?" \u00B7 "+c.services.length+" services":"")+'</div></div><span class="device-type-badge '+getTypeClass(c.type)+'">'+esc(c.type)+'</span></div>';}).join("")+
    '</div>';
  }
  if(parent){
    html+='<div class="detail-section"><div class="detail-section-title">Host</div>'+
      '<div class="child-device" data-detail-id="'+esc(parent.id)+'"><div><div class="child-device-name">'+esc(parent.name)+'</div><div class="child-device-info">'+esc(parent.type)+'</div></div><span class="device-type-badge '+getTypeClass(parent.type)+'">'+esc(parent.type)+'</span></div>'+
    '</div>';
  }
  if(d.notes){
    html+='<div class="detail-section"><div class="detail-section-title">Notes</div><div class="detail-notes">'+esc(d.notes)+'</div></div>';
  }
  html+='</div>';
  document.getElementById("detailPanel").innerHTML=html;
  document.getElementById("detailOverlay").classList.add("open");
}
function closeDetail(){document.getElementById("detailOverlay").classList.remove("open");}
document.getElementById("searchBox").addEventListener("input",function(){document.getElementById("searchWrap").classList.toggle("has-value",!!this.value);renderDevices();});
document.getElementById("searchClear").addEventListener("click",function(){var b=document.getElementById("searchBox");b.value="";document.getElementById("searchWrap").classList.remove("has-value");b.focus();renderDevices();});
document.getElementById("filterGroup").addEventListener("click",function(e){var b=e.target.closest("[data-filter]");if(b)setFilter(b.getAttribute("data-filter"));});
document.getElementById("deviceGrid").addEventListener("click",function(e){var c=e.target.closest("[data-id]");if(c)showDetail(c.getAttribute("data-id"));});
document.getElementById("deviceGrid").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var c=e.target.closest("[data-id]");if(c){e.preventDefault();showDetail(c.getAttribute("data-id"));}}});
document.getElementById("detailPanel").addEventListener("click",function(e){var n=e.target.closest("[data-detail-id]");if(n){showDetail(n.getAttribute("data-detail-id"));return;}if(e.target.closest("[data-action=close-detail]"))closeDetail();});
document.getElementById("detailOverlay").addEventListener("click",function(e){if(e.target.id==="detailOverlay")closeDetail();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail();});
renderStats();renderFilters();renderDevices();
</script>
</body>
</html>
