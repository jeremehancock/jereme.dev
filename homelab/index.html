@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root{--bg-primary:#0a0e14;--bg-secondary:#111820;--bg-tertiary:#1a2130;--bg-card:#141b24;--border:#1e2a3a;--border-active:#2d4a6f;--text-primary:#c8d6e5;--text-secondary:#95a8be;--text-muted:#738aa3;--accent:#39c5bb;--accent-dim:#2a9d95;--accent-glow:rgba(57,197,187,0.15);--success:#4bc77a;--tag-bg:rgba(57,197,187,0.1);--tag-border:rgba(57,197,187,0.25);--purple:#b478e6;--purple-bg:rgba(180,120,230,0.15);--blue:#648ce6;--blue-bg:rgba(100,140,230,0.15);--radius:6px;--shadow:0 2px 12px rgba(0,0,0,0.3);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;line-height:1.6;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg-primary);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--border-active);}
.header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;}
.main{max-width:1200px;margin:0 auto;padding:24px 32px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.search-wrap{position:relative;display:inline-block;}
.search-box{font-family:'JetBrains Mono',monospace;font-size:15px;padding:8px 34px 8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);width:320px;outline:none;transition:border-color 0.15s ease;}
.search-box::placeholder{color:var(--text-muted);}.search-box:focus{border-color:var(--accent);}
.search-clear{display:none;position:absolute;top:50%;right:6px;transform:translateY(-50%);width:22px;height:22px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:50%;padding:0;font-size:14px;line-height:1;align-items:center;justify-content:center;transition:color 0.15s,background 0.15s;}
.search-clear:hover{color:var(--text-primary);background:var(--bg-tertiary);}
.search-wrap.has-value .search-clear{display:inline-flex;}
.filter-group{display:flex;gap:4px;flex-wrap:wrap;}
.filter-btn{font-family:'JetBrains Mono',monospace;font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.15s ease;text-transform:uppercase;letter-spacing:0.5px;}
.filter-btn:hover{border-color:var(--border-active);color:var(--text-primary);}.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
.filter-select{display:none;position:relative;width:100%;min-width:0;}
.filter-select-toggle{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace;font-size:14px;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;text-align:left;transition:border-color 0.15s;}
.filter-select-toggle:hover{border-color:var(--border-active);}
.filter-select-toggle[aria-expanded="true"]{border-color:var(--accent);}
.filter-select-chevron{color:var(--text-muted);flex-shrink:0;transition:transform 0.15s;}
.filter-select-toggle[aria-expanded="true"] .filter-select-chevron{transform:rotate(180deg);}
.filter-select-menu{list-style:none;position:absolute;top:calc(100% + 4px);left:0;right:0;margin:0;padding:4px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);z-index:50;max-height:240px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.filter-select-menu[hidden]{display:none;}
.filter-select-option{font-family:'JetBrains Mono',monospace;font-size:14px;padding:8px 12px;border-radius:4px;color:var(--text-secondary);cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;transition:background 0.1s,color 0.1s;}
.filter-select-option:hover{background:var(--bg-tertiary);color:var(--text-primary);}
.filter-select-option.active{background:var(--accent-glow);color:var(--accent);}
.stats-bar{display:flex;gap:24px;margin-bottom:24px;padding:14px 20px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;}
.stat{display:flex;align-items:baseline;gap:6px;}.stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--accent);}.stat-label{font-size:14px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;}
.device-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
.device-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:all 0.15s ease;cursor:pointer;position:relative;}
.device-card:hover,.device-card:focus-visible{border-color:var(--border-active);box-shadow:var(--shadow);}.device-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}.device-card.has-children{border-left:3px solid var(--accent);}
.device-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.device-name{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--text-primary);}
.device-type-badge{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.8px;padding:3px 8px;border-radius:3px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.device-type-badge svg{flex-shrink:0;display:block;}
.badge-server{background:rgba(57,197,187,0.15);color:var(--accent);}.badge-vm{background:var(--blue-bg);color:var(--blue);}.badge-container{background:var(--purple-bg);color:var(--purple);}.badge-network{background:rgba(230,180,60,0.15);color:#e6b43c;}.badge-storage{background:rgba(230,120,80,0.15);color:#e67850;}.badge-other{background:rgba(150,150,170,0.15);color:#9696aa;}
.device-parent-link{font-size:13px;color:var(--text-muted);margin-bottom:8px;}.device-parent-link strong{color:var(--text-secondary);}
.device-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px;}.meta-item{font-size:14px;color:var(--text-secondary);}.meta-item strong{color:var(--text-primary);font-weight:500;}
.device-services{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.service-tag{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 8px;border-radius:3px;background:var(--tag-bg);border:1px solid var(--tag-border);color:var(--accent);}
.child-count-badge{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 8px;border-radius:3px;background:var(--blue-bg);color:var(--blue);margin-top:8px;display:inline-block;}
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}.detail-overlay.open{display:flex;}
.detail-panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;width:85%;max-width:1000px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.detail-header{flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-start;padding:22px;border-bottom:1px solid var(--border);background:var(--bg-secondary);}
.detail-body{padding:22px;flex:1 1 auto;overflow-y:auto;min-height:0;}.detail-section{margin-bottom:20px;}
.detail-section-title{font-family:'JetBrains Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.detail-field-label{font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;}.detail-field-value{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--text-primary);}
.detail-notes{font-size:15px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;}
.btn{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;transition:all 0.15s ease;display:inline-flex;align-items:center;gap:6px;}.btn:hover{border-color:var(--border-active);background:var(--bg-card);}.btn-ghost{border-color:transparent;background:transparent;}.btn-ghost:hover{background:var(--bg-tertiary);}.btn-sm{padding:5px 10px;font-size:14px;}
.service-table{width:100%;border-collapse:collapse;}.service-table th{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}.service-table td{font-family:'JetBrains Mono',monospace;font-size:14px;padding:8px 10px;color:var(--text-primary);border-bottom:1px solid var(--border);}.service-table td.svc-notes{color:var(--text-secondary);font-family:'IBM Plex Sans',sans-serif;}.service-table tr:last-child td{border-bottom:none;}
.child-device{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:all 0.15s;}.child-device:hover{border-color:var(--border-active);background:var(--bg-tertiary);}.child-device-name{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;}.child-device-info{font-size:13px;color:var(--text-secondary);}
.empty-state{text-align:center;padding:80px 20px;}.empty-icon{font-size:52px;margin-bottom:16px;opacity:0.3;}.empty-title{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--text-secondary);margin-bottom:8px;}.empty-text{font-size:15px;color:var(--text-muted);margin-bottom:20px;}
.footer{text-align:center;padding:24px 16px;border-top:1px solid var(--border);margin-top:40px;}.footer-link{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-muted);text-decoration:none;transition:color 0.15s;}.footer-link:hover{color:var(--accent);}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.view-btn{font-family:'JetBrains Mono',monospace;font-size:13px;padding:5px 12px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.5px;}
.view-btn:hover{color:var(--text-primary);background:var(--bg-tertiary);}.view-btn.active{color:var(--accent);background:var(--accent-glow);}.view-btn+.view-btn{border-left:1px solid var(--border);}
.topology-view{display:none;}.topology-view.active{display:block;}
.topology-empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:15px;}
.topology-clusters{display:grid;grid-template-columns:repeat(auto-fill,280px);gap:28px 24px;align-items:start;justify-content:center;}
.topo-cluster{overflow:visible;display:block;}
.topo-cluster .topo-box{fill:var(--bg-card);stroke:var(--border);stroke-width:1;transition:fill 0.15s,stroke 0.15s,filter 0.15s;}
.topo-cluster .topo-node{cursor:pointer;}
.topo-cluster .topo-node:hover .topo-box,.topo-cluster .topo-node:focus-visible .topo-box{fill:var(--bg-tertiary);stroke:var(--border-active);filter:drop-shadow(0 0 8px rgba(57,197,187,0.35));}
.topo-cluster .topo-node:focus{outline:none;}
.topo-cluster .topo-text-name{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;fill:var(--text-primary);pointer-events:none;}
.topo-cluster .topo-text-type{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--text-muted);letter-spacing:0.5px;pointer-events:none;}
.topo-cluster .topo-edge{stroke:var(--border-active);stroke-width:1;fill:none;}
.topo-cluster .topo-accent{pointer-events:none;}
.topo-accent-server{fill:var(--accent);}.topo-accent-vm{fill:var(--blue);}.topo-accent-container{fill:var(--purple);}.topo-accent-network{fill:#e6b43c;}.topo-accent-storage{fill:#e67850;}.topo-accent-other{fill:#9696aa;}
.topo-cluster .topo-type-icon{pointer-events:none;}
.topo-type-icon-server{color:var(--accent);}.topo-type-icon-vm{color:var(--blue);}.topo-type-icon-container{color:var(--purple);}.topo-type-icon-network{color:#e6b43c;}.topo-type-icon-storage{color:#e67850;}.topo-type-icon-other{color:#9696aa;}
@media (max-width:640px){.header{padding:12px 16px;}.main{padding:16px;}.device-grid{grid-template-columns:1fr;}.detail-grid{grid-template-columns:1fr;}.toolbar{flex-direction:column;align-items:stretch;}.search-wrap{display:block;}.search-box{width:100%;}.stats-bar{flex-wrap:wrap;gap:16px;}.view-toggle{display:flex;}.view-toggle .view-btn{flex:1;text-align:center;justify-content:center;}.topology-clusters{grid-template-columns:1fr;max-width:320px;margin:0 auto;justify-content:center;}.topo-cluster{width:100%;height:auto;}.filter-group{display:none;}.filter-select{display:block;}}
</style>

function getFilteredDevices(){
  var query=document.getElementById("searchBox").value.toLowerCase();

      var svcText=(d.services||[]).map(function(s){return s.name+" "+s.notes;}).join(" ");

      var hay=[d.name,d.os,d.system,d.type,d.cpu,d.ram,d.notes,svcText,storageText].join(" ").toLowerCase();
      return hay.indexOf(query)!==-1;
    }

    '<text x="'+textX+'" y="'+nameY+'" class="topo-text-name">'+esc(truncateLabel(d.name,nameMax))+'</text>'+

function topologyClusterSvg(parent,children){
  var w=280,parentH=60,childH=50,childIndent=26,childGap=10,childTopGap=20,pad=6;
  var childW=w-childIndent;
  var svg=topoBoxSvg(parent,0,0,w,parentH,true);
  if(children.length){
    var trunkX=11,trunkTop=parentH;
    var lastChildCenter=parentH+childTopGap+(children.length-1)*(childH+childGap)+childH/2;
    svg+='<line x1="'+trunkX+'" y1="'+trunkTop+'" x2="'+trunkX+'" y2="'+lastChildCenter+'" class="topo-edge"/>';
    children.forEach(function(c,i){
      var y=parentH+childTopGap+i*(childH+childGap);
      var cy=y+childH/2;
      svg+='<line x1="'+trunkX+'" y1="'+cy+'" x2="'+childIndent+'" y2="'+cy+'" class="topo-edge"/>';
      svg+=topoBoxSvg(c,childIndent,y,childW,childH,false);
    });
  }
  var contentH=children.length?parentH+childTopGap+children.length*(childH+childGap)-childGap:parentH;
  var svgW=w+pad*2,svgH=contentH+pad*2;
  var ariaLabel=esc(parent.name)+(children.length?" with "+children.length+" child device"+(children.length===1?"":"s"):"");
  return '<svg class="topo-cluster" viewBox="'+(-pad)+' '+(-pad)+' '+svgW+' '+svgH+'" width="'+svgW+'" height="'+svgH+'" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="'+ariaLabel+'">'+svg+'</svg>';

function renderTopology(){
  var filtered=getFilteredDevices();
  var container=document.getElementById("topologyView");
  if(!filtered.length){container.innerHTML='<div class="topology-empty">'+(DEVICES.length===0?"No devices yet.":"No matches for the current search/filter.")+'</div>';return;}
  var filteredIds={};filtered.forEach(function(d){filteredIds[d.id]=1;});
  var roots=filtered.filter(function(d){return !d.parentId;});
  var orphans=filtered.filter(function(d){return d.parentId&&!filteredIds[d.parentId];});
  var clusters=[];
  roots.forEach(function(p){clusters.push({parent:p,children:filtered.filter(function(c){return c.parentId===p.id;})});});
  orphans.forEach(function(o){clusters.push({parent:o,children:[]});});
  clusters.sort(function(a,b){return (a.parent.name||"").localeCompare(b.parent.name||"",undefined,{sensitivity:"base"});});
  container.innerHTML='<div class="topology-clusters">'+clusters.map(function(c){return topologyClusterSvg(c.parent,c.children);}).join("")+'</div>';

  if(d.services&&d.services.length){
    var sortedSv=sortedServices(d.services);
    html+='<div class="detail-section"><div class="detail-section-title">Services ('+sortedSv.length+')</div>'+
      '<table class="service-table"><thead><tr><th>Service</th><th>Notes</th></tr></thead><tbody>'+
      sortedSv.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td class="svc-notes">'+(esc(s.notes)||"\u2014")+'</td></tr>';}).join("")+
      '</tbody></table></div>';
  }
  if(children.length){
    html+='<div class="detail-section"><div class="detail-section-title">Running on this host ('+children.length+')</div>'+
      children.map(function(c){return '<div class="child-device" data-detail-id="'+esc(c.id)+'"><div><div class="child-device-name">'+esc(c.name)+'</div><div class="child-device-info">'+esc(c.type)+(c.services&&c.services.length?" \u00B7 "+c.services.length+" services":"")+'</div></div>'+typeBadge(c.type)+'</div>';}).join("")+
    '</div>';
  }
  if(parent){
    html+='<div class="detail-section"><div class="detail-section-title">Host</div>'+
      '<div class="child-device" data-detail-id="'+esc(parent.id)+'"><div><div class="child-device-name">'+esc(parent.name)+'</div><div class="child-device-info">'+esc(parent.type)+'</div></div>'+typeBadge(parent.type)+'</div>'+
    '</div>';
  }
  if(d.notes){
    html+='<div class="detail-section"><div class="detail-section-title">Notes</div><div class="detail-notes">'+esc(d.notes)+'</div></div>';
  }
  html+='</div>';
  document.getElementById("detailPanel").innerHTML=html;
  document.getElementById("detailOverlay").classList.add("open");
}
function closeDetail(){document.getElementById("detailOverlay").classList.remove("open");}
document.getElementById("searchBox").addEventListener("input",function(){document.getElementById("searchWrap").classList.toggle("has-value",!!this.value);renderDevices();if(currentView==="topology")renderTopology();});
document.getElementById("searchClear").addEventListener("click",function(){var b=document.getElementById("searchBox");b.value="";document.getElementById("searchWrap").classList.remove("has-value");b.focus();renderDevices();if(currentView==="topology")renderTopology();});
document.getElementById("filterGroup").addEventListener("click",function(e){var b=e.target.closest("[data-filter]");if(b)setFilter(b.getAttribute("data-filter"));});
document.getElementById("filterToggle").addEventListener("click",function(e){e.stopPropagation();toggleFilterMenu();});
document.getElementById("filterMenu").addEventListener("click",function(e){var o=e.target.closest("[data-filter]");if(o){closeFilterMenu();setFilter(o.getAttribute("data-filter"));}});
document.addEventListener("click",function(e){var w=document.getElementById("filterSelectWrap");if(w&&!w.contains(e.target))closeFilterMenu();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeFilterMenu();});
document.getElementById("deviceGrid").addEventListener("click",function(e){var c=e.target.closest("[data-id]");if(c)showDetail(c.getAttribute("data-id"));});
document.getElementById("deviceGrid").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){var c=e.target.closest("[data-id]");if(c){e.preventDefault();showDetail(c.getAttribute("data-id"));}}});
document.getElementById("topologyView").addEventListener("click",function(e){var n=e.target.closest("[data-id]");if(n)showDetail(n.getAttribute("data-id"));});
document.querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){setView(b.getAttribute("data-view"));});});
document.getElementById("detailPanel").addEventListener("click",function(e){var n=e.target.closest("[data-detail-id]");if(n){showDetail(n.getAttribute("data-detail-id"));return;}if(e.target.closest("[data-action=close-detail]"))closeDetail();});
document.getElementById("detailOverlay").addEventListener("click",function(e){if(e.target.id==="detailOverlay")closeDetail();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail();});
applyViewUI();renderStats();renderFilters();renderDevices();if(currentView==="topology")renderTopology();
</script>
</body>
</html>
