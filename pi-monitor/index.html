<html>
<head>
<style>
html 
{
 overflow: auto;
}
 
html, body, div, iframe 
{
 margin: 0px; 
 padding: 0px; 
 height: 100%; 
 border: none;
}

iframe 
{
 display: block; 
 width: 100%; 
 border: none; 
 overflow-y: auto; 
 overflow-x: hidden;
 background: url(../images/loader-circles.svg) center center no-repeat;
 background-color: #161719;
}
</style>
</head>
<body>

<iframe id="rotator" frameborder="0" 
    marginheight="0" 
    marginwidth="0" 
    width="100%" 
    height="100%" 
    scrolling="auto"src="https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi0"></iframe>

<script>
// start when the page is loaded
window.onload = function() {

  var urls = [
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi0",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi1",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi2",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi3",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi4",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pi5",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=boincpi",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=noderedpi",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=prometheus",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=testpi",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=zerotv",
    "https://pilab.dev/metrics/d/wc_mbnZRz/pi-lab-metrics?orgId=1&refresh=30s&var-instance=pimonitor"
  ];

  var index = 1;
  var el = document.getElementById("rotator");

  setTimeout(function rotate() {

    if ( index === urls.length ) {
      index = 0;
    }

    el.src = urls[index];
    index  = index + 1;

    // continue rotating iframes
    setTimeout(rotate, 30000);

  }, 30000); // 5000ms = 5s
};
</script>
</body>
</html>
